<style>
/* ===========================================================
   Palette (dataviz skill reference palette — light/dark)
   =========================================================== */
:root {
  color-scheme: light;
  --surface-1:      #fcfcfb;
  --page-plane:      #f9f9f7;
  --text-primary:    #0b0b0b;
  --text-secondary:  #52514e;
  --muted:           #898781;
  --gridline:        #e1e0d9;
  --border:          rgba(11,11,11,0.10);

  --series-1: #2a78d6; /* blue   — business / coffees */
  --series-2: #eb6834; /* orange — discretionary / hot chocolates */
  --series-3: #1baf7a; /* aqua   — living / drinks */
  --series-4: #eda100; /* yellow — bad food */

  --seq-100: #cde2fb;
  --seq-400: #3987e5;
  --seq-500: #256abf;
  --seq-600: #184f95;

  --good:     #006300;
  --critical: #d03b3b;

  --income-color: #1baf7a;
  --expense-color: #d03b3b;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:      #0d0d0d;
    --text-primary:    #ffffff;
    --text-secondary:  #c3c2b7;
    --muted:           #898781;
    --gridline:        #2c2c2a;
    --border:          rgba(255,255,255,0.10);

    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;

    --seq-100: #184f95;
    --seq-400: #3987e5;
    --seq-500: #256abf;
    --seq-600: #86b6ef;

    --good:     #0ca30c;
    --critical: #e66767;

    --income-color: #199e70;
    --expense-color: #e66767;
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--page-plane);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  padding-bottom: calc(64px + env(safe-area-inset-bottom));
  min-height: 100vh;
}

.app-header {
  padding: calc(12px + env(safe-area-inset-top)) 16px 10px;
  background: var(--surface-1);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 5;
}
.app-header h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
  text-align: center;
}

.view {
  padding: 14px 14px 24px;
  max-width: 520px;
  margin: 0 auto;
}

/* ---------------- segmented type toggle ---------------- */

.seg-group {
  display: flex;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 3px;
  margin-bottom: 16px;
}
.seg {
  flex: 1;
  border: none;
  background: transparent;
  padding: 9px 0;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-secondary);
  border-radius: 8px;
  cursor: pointer;
}
.seg.active {
  background: var(--expense-color);
  color: #fff;
}
.seg-group .seg[data-type="income"].active {
  background: var(--income-color);
}

/* ---------------- pickers / chips ---------------- */

.chip-group { margin-bottom: 14px; }
.picker-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  margin-bottom: 8px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip {
  border: 1px solid var(--border);
  background: var(--surface-1);
  color: var(--text-primary);
  padding: 9px 14px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
.chip.active {
  background: var(--seq-500);
  border-color: var(--seq-500);
  color: #fff;
}
.section-chip {
  border-color: var(--chip-color, var(--border));
  color: var(--chip-color, var(--text-primary));
  font-weight: 600;
}
.section-chip.active {
  background: var(--chip-color, var(--seq-500));
  border-color: var(--chip-color, var(--seq-500));
  color: #fff;
}

/* ---------------- entry fields ---------------- */

.entry-fields { margin-bottom: 14px; }
.field { margin-bottom: 12px; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;

<script>
/* ===========================================================
   Income & Expenditure — core data model + logic
   =========================================================== */
(function () {

const STORAGE_KEY = 'ie_entries_v1';

const CATEGORIES = {
  income: {
    label: 'Income',
    subcategories: ['TA', 'AI', 'Sold something', 'Misc']
  },
  expense: {
    label: 'Expense',
    sections: {
      business: {
        label: 'Business',
        color: 'var(--series-1)',
        subcategories: ['Stock', 'AdWords', 'Printing/Advertising', 'Tools', 'Vehicle', 'Fuel', 'Software', 'Misc']
      },
      living: {
        label: 'Living',
        color: 'var(--series-3)',
        subcategories: ['Accommodation', 'Food', 'Bills', 'Drinks', 'Groceries', 'Misc']
      },
      discretionary: {
        label: 'Discretionary',
        color: 'var(--series-2)',
        subcategories: ['Going out', 'Coffees', 'Hot chocolates', 'Tennis', 'Clothes', 'Bad food', 'Misc']
      }
    }
  }
};

// The four subcategories being tracked as "wasteful spending"
const WASTEFUL_SUBCATEGORIES = ['Coffees', 'Hot chocolates', 'Drinks', 'Bad food'];

const GOALS = [
  { name: 'UK ticket', amount: 2000 },
  { name: 'Ear surgery', amount: 4800 },
  { name: 'Hair transplant', amount: 5000 },
  { name: 'Teeth improved', amount: 2200 },
  { name: 'Singing lessons', amount: 400 },
  { name: 'Ultra-sharp outfit', amount: 620 }
];

/* ---------------- storage ---------------- */

function loadEntries() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error('Failed to load entries', e);
    return [];
  }
}

function saveEntries(entries) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

function addEntry(entry) {
  const entries = loadEntries();
  entry.id = (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
  entry.createdAt = new Date().toISOString();
  entries.push(entry);
  saveEntries(entries);
  return entry;
}

function deleteEntry(id) {
  const entries = loadEntries().filter(e => e.id !== id);
  saveEntries(entries);
}

/* ---------------- date helpers ---------------- */

function todayStr() {
  return toDateStr(new Date());
}

function toDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// Monday-start week containing `d`
function weekStart(d) {
  const date = new Date(d);
  const day = date.getDay(); // 0 = Sun
  const diff = (day === 0 ? -6 : 1) - day; // days to subtract to reach Monday
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
}

function isInCurrentWeek(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const start = weekStart(new Date());
  const end = new Date(start);
  end.setDate(end.getDate() + 7);
  return d >= start && d < end;
}

/* ---------------- totals ---------------- */

function totalsFor(entries, predicate) {
  let income = 0, expense = 0;
  entries.filter(predicate).forEach(e => {
    if (e.type === 'income') income += e.amount;
    else expense += e.amount;
  });
  return { income, expense, net: income - expense };
}

function todayTotals(entries) {
  const t = todayStr();
  return totalsFor(entries, e => e.date === t);
}

function weekTotals(entries) {
  return totalsFor(entries, e => isInCurrentWeek(e.date));
}

/* ---------------- insights: wasteful spending ---------------- */

function weeklyAverageForSubcategory(entries, subcategory) {
  const matches = entries
    .filter(e => e.type === 'expense' && e.subcategory === subcategory)
    .sort((a, b) => a.date.localeCompare(b.date));

  if (matches.length === 0) {
    return { weekly: 0, basis: 'no data yet' };
  }

  const today = new Date();
  const earliest = new Date(matches[0].date + 'T00:00:00');
  const daysElapsed = Math.max(1, Math.round((today - earliest) / 86400000) + 1);
  const totalSpent = matches.reduce((s, e) => s + e.amount, 0);

  // Not enough history yet to responsibly project a weekly/annual figure —
  // a single day's spend extrapolated over a week wildly overstates things.
  // Show the plain running total instead until a week of tracking has passed.
  const MIN_DAYS_FOR_ESTIMATE = 7;
  if (daysElapsed < MIN_DAYS_FOR_ESTIMATE) {
    return {
      weekly: null,
      total: totalSpent,
      notEnoughData: true,
      basis: `only ${daysElapsed} day${daysElapsed === 1 ? '' : 's'} tracked — check back after a week for an estimate`
    };
  }

  const cutoff28 = new Date(today);
  cutoff28.setDate(cutoff28.getDate() - 28);

  if (daysElapsed >= 28) {
    const recentTotal = matches
      .filter(e => new Date(e.date + 'T00:00:00') >= cutoff28)
      .reduce((s, e) => s + e.amount, 0);
    return { weekly: recentTotal / 4, total: totalSpent, basis: 'avg of last 4 weeks' };
  }

  const weeksElapsed = daysElapsed / 7;
  const weekly = totalSpent / weeksElapsed;
  return { weekly, total: totalSpent, basis: 'avg since you started tracking' };
}

function wastefulInsights(entries) {
  const rows = WASTEFUL_SUBCATEGORIES.map(sub => {
    const r = weeklyAverageForSubcategory(entries, sub);
    const weekly = r.weekly ?? 0;
    return {
      subcategory: sub,
      weekly,
      annual: weekly * 52,
      basis: r.basis,
      total: r.total ?? 0,
      notEnoughData: !!r.notEnoughData
    };
  });
  // Categories without enough history yet don't count toward the combined
  // total/goal comparison — avoids one early data point skewing everything.
  const combinedWeekly = rows.filter(r => !r.notEnoughData).reduce((s, r) => s + r.weekly, 0);
  const combinedAnnual = combinedWeekly * 52;
  return { rows, combinedWeekly, combinedAnnual };
}

function goalProgress(combinedAnnual) {
  return GOALS.map(g => ({
    ...g,
    percent: g.amount > 0 ? (combinedAnnual / g.amount) * 100 : 0
  }));
}

/* ---------------- formatting ---------------- */

function fmtMoney(n) {
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtMoneyShort(n) {
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('en-AU', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

/* ---------------- CSV export ---------------- */

function csvEscape(val) {
  const s = String(val ?? '');
  if (/[",\n]/.test(s)) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function entriesToCSV(entries) {
  const header = ['Date', 'Type', 'Section', 'Subcategory', 'Amount', 'Note'];
  const rows = entries
    .slice()
    .sort((a, b) => a.date.localeCompare(b.date) || a.createdAt.localeCompare(b.createdAt))
    .map(e => [
      e.date,
      e.type === 'income' ? 'Income' : 'Expense',
      e.section || '',
      e.subcategory,
      e.amount.toFixed(2),
      e.note || ''
    ].map(csvEscape).join(','));
  return [header.join(','), ...rows].join('\n');
}

function currentWeekEntries(entries) {
  return entries.filter(e => isInCurrentWeek(e.date));
}

/* export for use by ui.js */
window.IE = {
  CATEGORIES, WASTEFUL_SUBCATEGORIES, GOALS,
  loadEntries, saveEntries, addEntry, deleteEntry,
  todayStr, toDateStr, weekStart, isInCurrentWeek,
  todayTotals, weekTotals,
  wastefulInsights, goalProgress,
  fmtMoney, fmtMoneyShort,
  entriesToCSV, currentWeekEntries
};

})();

</script>
<script>
/* ===========================================================
   Income & Expenditure — UI rendering + interaction
   =========================================================== */
(function () {

const { CATEGORIES, WASTEFUL_SUBCATEGORIES, GOALS,
  loadEntries, addEntry, deleteEntry,
  todayStr, isInCurrentWeek,
  todayTotals, weekTotals,
  wastefulInsights, goalProgress,
  fmtMoney, fmtMoneyShort,
  entriesToCSV, currentWeekEntries } = window.IE;

const state = {
  tab: 'home',
  type: 'expense',      // 'expense' | 'income' — app always OPENS on expense per spec
  section: null,        // business | living | discretionary (expense only)
  subcategory: null,
  date: todayStr(),
  note: ''
};

/* ---------------- tab switching ---------------- */

function switchTab(tab) {
  state.tab = tab;
  document.getElementById('view-home').hidden = tab !== 'home';
  document.getElementById('view-insights').hidden = tab !== 'insights';
  document.querySelectorAll('.tab-bar button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  if (tab === 'insights') renderInsights();
}

/* ---------------- Home tab: entry form ---------------- */

function resetSelection(keepType) {
  state.section = null;
  state.subcategory = null;
  state.note = '';
  if (!keepType) state.type = 'expense';
}

function renderTypeToggle() {
  const el = document.getElementById('type-toggle');
  el.innerHTML = `
    <button class="seg ${state.type === 'expense' ? 'active' : ''}" data-type="expense">Expense</button>
    <button class="seg ${state.type === 'income' ? 'active' : ''}" data-type="income">Income</button>
  `;
  el.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      state.type = btn.dataset.type;
      state.section = null;
      state.subcategory = null;
      renderTypeToggle();
      renderPicker();
    });
  });
}

function renderPicker() {
  const wrap = document.getElementById('picker');
  wrap.innerHTML = '';

  if (state.type === 'income') {
    wrap.appendChild(renderChipGroup(
      'Category',
      CATEGORIES.income.subcategories,
      state.subcategory,
      (sub) => { state.subcategory = sub; renderPicker(); focusAmount(); }
    ));
    updateSaveButton();
    return;
  }

  // expense: choose section first
  const sectionKeys = Object.keys(CATEGORIES.expense.sections);
  const sectionGroup = document.createElement('div');
  sectionGroup.className = 'chip-group';
  const label = document.createElement('div');
  label.className = 'picker-label';
  label.textContent = 'Section';
  sectionGroup.appendChild(label);
  const chips = document.createElement('div');
  chips.className = 'chips';
  sectionKeys.forEach(key => {
    const sec = CATEGORIES.expense.sections[key];
    const chip = document.createElement('button');
    chip.className = 'chip section-chip' + (state.section === key ? ' active' : '');
    chip.style.setProperty('--chip-color', sec.color);
    chip.textContent = sec.label;
    chip.addEventListener('click', () => {
      state.section = key;
      state.subcategory = null;
      renderPicker();
    });
    chips.appendChild(chip);
  });
  sectionGroup.appendChild(chips);
  wrap.appendChild(sectionGroup);

  if (state.section) {
    const sec = CATEGORIES.expense.sections[state.section];
    wrap.appendChild(renderChipGroup(
      'Category',
      sec.subcategories,
      state.subcategory,
      (sub) => { state.subcategory = sub; renderPicker(); focusAmount(); }
    ));
  }

  updateSaveButton();
}

function renderChipGroup(labelText, options, selected, onSelect) {
  const group = document.createElement('div');
  group.className = 'chip-group';
  const label = document.createElement('div');
  label.className = 'picker-label';
  label.textContent = labelText;
  group.appendChild(label);
  const chips = document.createElement('div');
  chips.className = 'chips';
  options.forEach(opt => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (selected === opt ? ' active' : '');
    chip.textContent = opt;
    chip.addEventListener('click', () => onSelect(opt));
    chips.appendChild(chip);
  });
  group.appendChild(chips);
  return group;
}

function focusAmount() {
  requestAnimationFrame(() => {
    const el = document.getElementById('amount-input');
    if (el) el.focus();
  });
}

function canSave() {
  const amount = parseFloat(document.getElementById('amount-input').value);
  if (!state.subcategory) return false;
  if (state.type === 'expense' && !state.section) return false;
  if (!(amount > 0)) return false;
  return true;
}

function updateSaveButton() {
  document.getElementById('save-btn').disabled = !canSave();
}

function handleSave() {
  const amountInput = document.getElementById('amount-input');
  const noteInput = document.getElementById('note-input');
  const dateInput = document.getElementById('date-input');
  const amount = parseFloat(amountInput.value);
  if (!canSave()) return;

  addEntry({
    type: state.type,
    section: state.type === 'expense' ? state.section : null,
    subcategory: state.subcategory,
    amount: Math.round(amount * 100) / 100,
    date: dateInput.value || todayStr(),
    note: noteInput.value.trim()
  });

  // Reset for fast repeat entry — stay on same type/section (sticky),
  // but clear the picked subcategory/amount/note.
  state.subcategory = null;
  amountInput.value = '';
  noteInput.value = '';
  dateInput.value = todayStr();

  renderPicker();
  renderTotals();
  renderRecent();
  updateSaveButton();
}

function renderTotals() {
  const entries = loadEntries();
  const t = todayTotals(entries);
  const w = weekTotals(entries);
  document.getElementById('totals-row').innerHTML = `
    <div class="stat-tile">
      <div class="stat-label">Today</div>
      <div class="stat-value">${fmtMoney(t.net)}</div>
      <div class="stat-sub">+${fmtMoney(t.income)} in / -${fmtMoney(t.expense)} out</div>
    </div>
    <div class="stat-tile">
      <div class="stat-label">This week</div>
      <div class="stat-value">${fmtMoney(w.net)}</div>
      <div class="stat-sub">+${fmtMoney(w.income)} in / -${fmtMoney(w.expense)} out</div>
    </div>
  `;
}

function entryRowHtml(e, showDate) {
  const dateLabel = showDate
    ? new Date(e.date + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }) + ' · '
    : '';
  return `
    <div class="recent-row" data-id="${e.id}">
      <div class="recent-main">
        <span class="recent-cat">${dateLabel}${e.subcategory}${e.section ? ' · ' + CATEGORIES.expense.sections[e.section].label : ''}</span>
        ${e.note ? `<span class="recent-note">${escapeHtml(e.note)}</span>` : ''}
      </div>
      <div class="recent-amount ${e.type === 'income' ? 'income' : 'expense'}">
        ${e.type === 'income' ? '+' : '-'}${fmtMoney(e.amount)}
      </div>
      <button class="recent-del" aria-label="Delete entry" data-id="${e.id}">×</button>
    </div>
  `;
}

function wireDeleteButtons(container, onDeleted) {
  container.querySelectorAll('.recent-del').forEach(btn => {
    btn.addEventListener('click', () => {
      deleteEntry(btn.dataset.id);
      renderTotals();
      renderRecent();
      if (!document.getElementById('all-entries-section').hidden) renderAllEntries();
      if (state.tab === 'insights') renderInsights();
      if (onDeleted) onDeleted();
    });
  });
}

function renderRecent() {
  const entries = loadEntries();
  const today = todayStr();
  const todays = entries.filter(e => e.date === today)
    .sort((a, b) => b.createdAt.localeCompare(a.createdAt));

  const list = document.getElementById('recent-list');
  if (todays.length === 0) {
    list.innerHTML = '<div class="empty-msg">No entries yet today.</div>';
    return;
  }
  list.innerHTML = todays.map(e => entryRowHtml(e, false)).join('');
  wireDeleteButtons(list);
}

function renderAllEntries() {
  const entries = loadEntries().slice().sort((a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt));
  const list = document.getElementById('all-entries-list');
  if (entries.length === 0) {
    list.innerHTML = '<div class="empty-msg">No entries logged yet.</div>';
    return;
  }
  list.innerHTML = entries.map(e => entryRowHtml(e, true)).join('');
  wireDeleteButtons(list);
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

/* ---------------- Insights tab ---------------- */

function renderInsights() {
  const entries = loadEntries();
  const { rows, combinedWeekly, combinedAnnual } = wastefulInsights(entries);
  const goals = goalProgress(combinedAnnual);

  const grid = document.getElementById('waste-grid');
  grid.innerHTML = rows.map(r => {
    if (r.notEnoughData) {
      return `
        <div class="waste-tile">
          <div class="waste-name">${r.subcategory}</div>
          <div class="waste-weekly">${fmtMoneyShort(r.total)}<span class="unit"> so far</span></div>
          <div class="waste-basis">${r.basis}</div>
        </div>
      `;
    }
    return `
      <div class="waste-tile">
        <div class="waste-name">${r.subcategory}</div>
        <div class="waste-weekly">${fmtMoneyShort(r.weekly)}<span class="unit">/wk</span></div>
        <div class="waste-annual">${fmtMoney(r.annual)}<span class="unit">/yr</span></div>
        <div class="waste-basis">${r.basis}</div>
      </div>
    `;
  }).join('');

  document.getElementById('waste-combined').innerHTML = `
    <div class="combined-label">Combined wasteful spend</div>
    <div class="combined-weekly">${fmtMoneyShort(combinedWeekly)}<span class="unit">/wk</span></div>
    <div class="combined-annual">${fmtMoney(combinedAnnual)} <span class="unit">per year</span></div>
  `;

  const goalsEl = document.getElementById('goals-list');
  goalsEl.innerHTML = goals.map(g => {
    const pct = g.percent;
    const pctDisplay = pct >= 100 ? Math.round(pct) : pct.toFixed(0);
    const complete = pct >= 100;
    return `
      <div class="goal-row ${complete ? 'complete' : ''}">
        <div class="goal-top">
          <span class="goal-name">${g.name}</span>
          <span class="goal-amount">${fmtMoneyShort(g.amount)}</span>
        </div>
        <div class="meter">
          <div class="meter-track">
            <div class="meter-fill" style="width:${Math.min(pct, 100)}%"></div>
          </div>
          <div class="meter-pct">${complete ? '✓ ' : ''}${pctDisplay}%</div>
        </div>
      </div>
    `;
  }).join('');
}

/* ---------------- export (weekly CSV + share sheet) ---------------- */

async function handleExport() {
  const entries = loadEntries();
  const weekEntries = currentWeekEntries(entries);
  if (weekEntries.length === 0) {
    alert('No entries logged for this week yet.');
    return;
  }
  const csv = entriesToCSV(weekEntries);
  const filename = `income-expenditure-week-${todayStr()}.csv`;
  const file = new File([csv], filename, { type: 'text/csv' });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: filename });
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return; // user cancelled
      console.warn('Share failed, falling back to download', err);
    }
  }

  // fallback: trigger a download
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* ---------------- init ---------------- */

function init() {
  resetSelection(false); // always opens on Expense tab/mode
  renderTypeToggle();
  renderPicker();
  renderTotals();
  renderRecent();

  document.getElementById('date-input').value = todayStr();
  document.getElementById('amount-input').addEventListener('input', updateSaveButton);
  document.getElementById('save-btn').addEventListener('click', handleSave);
  document.getElementById('export-btn').addEventListener('click', handleExport);

  document.getElementById('toggle-all-btn').addEventListener('click', () => {
    const section = document.getElementById('all-entries-section');
    const btn = document.getElementById('toggle-all-btn');
    section.hidden = !section.hidden;
    btn.textContent = section.hidden ? 'Show all entries…' : 'Hide all entries';
    if (!section.hidden) renderAllEntries();
  });

  document.querySelectorAll('.tab-bar button').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  switchTab('home');

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed', err));
  }
}

document.addEventListener('DOMContentLoaded', init);

})();

</script>
