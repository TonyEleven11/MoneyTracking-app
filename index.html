<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Income &amp; Expenditure</title>

<!-- PWA / iOS home-screen support -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Income &amp; Expenditure">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>Income &amp; Expenditure</h1>
</header>

<!-- ============ HOME TAB ============ -->
<main id="view-home" class="view">

  <div id="type-toggle" class="seg-group"></div>

  <div id="picker"></div>

  <div class="entry-fields">
    <div class="field">
      <label for="amount-input">Amount</label>
      <div class="amount-wrap">
        <span class="amount-prefix">$</span>
        <input id="amount-input" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
      </div>
    </div>
    <div class="field field-inline">
      <div class="field-inline-item">
        <label for="date-input">Date</label>
        <input id="date-input" type="date">
      </div>
      <div class="field-inline-item field-grow">
        <label for="note-input">Note (optional)</label>
        <input id="note-input" type="text" placeholder="e.g. Woolworths">
      </div>
    </div>
  </div>

  <button id="save-btn" class="save-btn" disabled>Save entry</button>

  <section id="totals-row" class="totals-row"></section>

  <section class="recent-section">
    <div class="section-title">Today's entries</div>
    <div id="recent-list" class="recent-list"></div>
  </section>

  <button id="export-btn" class="export-btn">Export this week &amp; share…</button>
</main>

<!-- ============ INSIGHTS TAB ============ -->
<main id="view-insights" class="view" hidden>
  <div class="section-title">Where the money's leaking</div>
  <div id="waste-grid" class="waste-grid"></div>

  <div id="waste-combined" class="waste-combined"></div>

  <div class="section-title">What you could be saving for</div>
  <div id="goals-list" class="goals-list"></div>
</main>

<nav class="tab-bar">
  <button data-tab="home" class="active">Home</button>
  <button data-tab="insights">Insights</button>
</nav>

<script src="app.js"></script>
<script src="ui.js"></script>
</body>
</html>
